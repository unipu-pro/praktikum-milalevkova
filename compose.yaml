
name: praktikum

services:
  llm:
    build:
      context: .
    image: praktikum-llm
    environment:
      OLLAMA_BASE_URL: http://ollama-server:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    profiles: [cli]
    networks: [backend]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: praktikum-llm-tests
    networks: [backend]

  ollama-server:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [backend]

  ollama-pull:
    image: ollama/ollama:0.40.13
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    environment:
      OLLAMA_HOST: http://ollama-server:11434
    networks: [backend]
    depends_on:
      ollama-server:
        condition: service_healthy
    restart: "no"
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama-server:11434
      WEBUI_AUTH: "False"
    volumes:
      - open-webui-data:/app/backend/data
    networks: [backend]
    depends_on:
      ollama-server:
        condition: service_healthy
    restart: unless-stopped


volumes:
  ollama-models:
  open-webui-data:

networks:
  backend:

